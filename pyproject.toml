[project]
name = "agent-studio"
version = "0.1.0"
description = "Governed, multi-tenant, MCP-native builder for agents, RAG and workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "agent-studio" }]

# Adopt the engines (spec §1); build the governance. Core deps kept lean;
# heavier engines are optional extras so `make dev` and CI stay fast.
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "deepdiff>=7.0",          # manifest version diffs
    "httpx>=0.27",
]

[project.optional-dependencies]
runtime = [
    "langgraph>=0.2",
    "litellm>=1.44",
]
rag = [
    "llama-index-core>=0.11",
    "llama-index-vector-stores-postgres>=0.2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
agent-studio = "api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "seams", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
